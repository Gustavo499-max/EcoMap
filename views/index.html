<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EcoMap</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f8f4;
            color: #1f2937;
        }

        header {
            background: #198754;
            color: white;
            padding: 24px;
            text-align: center;
        }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .status {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            border-radius: 20px;
            background: #d1fae5;
            color: #065f46;
        }
    </style>
</head>

<body>

<header>
    <h1>♻️ EcoMap</h1>
    <p>Encontre pontos de reciclagem</p>
</header>

<main>
    <div class="card">
        <h2>Bem-vindo ao EcoMap!</h2>

        <p>
            Uma plataforma colaborativa para encontrar
            pontos de reciclagem.
        </p>

        <span class="status">
            Sistema online
        </span>
    </div>
</main>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EcoMap - Pontos de reciclagem</title>

    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

<header class="topo">
    <div class="container">
        <h1>♻️ EcoMap</h1>
        <p>Encontre pontos de reciclagem por cidade e tipo de material.</p>
    </div>
</header>

<main class="container">
    <form id="form-filtros" class="filtros" aria-label="Filtrar pontos de reciclagem">
        <div class="campo">
            <label for="filtro-cidade">Cidade</label>
            <select id="filtro-cidade" name="cidade">
                <option value="">Todas as cidades</option>
            </select>
        </div>

        <div class="campo">
            <label for="filtro-material">Material aceito</label>
            <select id="filtro-material" name="material">
                <option value="">Todos os materiais</option>
            </select>
        </div>

        <div class="acoes">
            <button type="submit" class="botao botao-primario">Filtrar</button>
            <button type="button" id="limpar-filtros" class="botao botao-secundario">Limpar filtros</button>
        </div>
    </form>

    <section id="resultados" aria-labelledby="titulo-resultados">
        <div class="resultados-topo">
            <h2 id="titulo-resultados">Pontos de reciclagem</h2>
            <p id="resumo" class="resumo" aria-live="polite"></p>
        </div>

        <div id="carregando" class="mensagem" role="status" hidden>
            <span class="spinner" aria-hidden="true"></span>
            Carregando pontos de reciclagem…
        </div>

        <div id="vazio" class="mensagem" role="status" hidden>
            <p id="vazio-texto"></p>
        </div>

        <div id="erro" class="mensagem mensagem-erro" role="alert" hidden>
            <p>Não foi possível carregar os pontos de reciclagem. Verifique sua conexão e tente novamente.</p>
            <button type="button" id="tentar-novamente" class="botao botao-secundario">Tentar novamente</button>
        </div>

        <ul id="lista-pontos" class="lista" hidden></ul>
    </section>
</main>

<script src="/js/app.js" defer></script>

</body>
</html>
